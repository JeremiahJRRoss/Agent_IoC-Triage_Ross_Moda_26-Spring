name: Postman Demo Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  postman-demo:
    runs-on: ubuntu-latest
    env:
      FLOWRUN_DEMO_MODE: "true"
      FLOWRUN_NO_PROMPT: "1"
      HEALTH_LATENCY_THRESHOLD_MS: "1000"
      BASE_URL: "http://127.0.0.1:7777"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Newman
        run: npm install -g newman newman-reporter-junitfull newman-reporter-htmlextra

      - name: Start API in demo mode
        run: |
          nohup python -m uvicorn web.app:app --host 127.0.0.1 --port 7777 > server.log 2>&1 &

      - name: Wait for health endpoint
        run: |
          for i in {1..30}; do
            if curl -fsS "$BASE_URL/health" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become healthy in time"
          exit 1

      - name: Assert health latency threshold
        run: |
          latency_s=$(curl -o /dev/null -s -w '%{time_total}' "$BASE_URL/health")
          latency_ms=$(awk "BEGIN { printf \"%.2f\", ${latency_s} * 1000 }")
          echo "Health latency: ${latency_ms}ms"
          if awk "BEGIN { exit !(${latency_ms} > ${HEALTH_LATENCY_THRESHOLD_MS}) }"; then
            echo "Health latency ${latency_ms}ms exceeds threshold ${HEALTH_LATENCY_THRESHOLD_MS}ms"
            exit 1
          fi
          echo "Health latency check passed: ${latency_ms}ms <= ${HEALTH_LATENCY_THRESHOLD_MS}ms"

      - name: Run Postman collection with Newman
        run: |
          mkdir -p artifacts/postman
          set -o pipefail
          ./scripts/postman.sh full | tee artifacts/postman/newman-cli-summary.txt

      - name: Gate on assertion count
        run: |
          total=$(jq '.run.stats.assertions.total' artifacts/postman/newman-report.json)
          failed=$(jq '.run.stats.assertions.failed' artifacts/postman/newman-report.json)
          echo "Assertions: $total total, $failed failed"
          test "$total" -ge 25 || { echo "Too few assertions: $total < 25"; exit 1; }
          test "$failed" -eq 0

      - name: Upload Postman artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-demo-artifacts
          path: |
            artifacts/postman/newman-cli-summary.txt
            artifacts/postman/newman-junit.xml
            artifacts/postman/newman-report.json
            artifacts/postman/newman-report.html
            server.log
